<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tongue Tied — AI Language Studio</title>
<meta name="theme-color" content="#130f1c">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #130f1c;
    --card: #1e182a;
    --card-light: #2a223a;
    --accent: #6c5ce7;
    --accent-glow: rgba(108, 92, 231, 0.45);
    --accent-gradient: linear-gradient(135deg, #6c5ce7 0%, #a29bfe 100%);
    --coral: #ff7675;
    --text: #f1f2f6;
    --text-dim: #b7bfcc;
    --border: rgba(255, 255, 255, 0.12);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Plus Jakarta Sans', sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  a { color: #a29bfe; }

  .wrap {
    max-width: 580px;
    margin: 0 auto;
    padding: 24px 18px 50px;
  }

  /* Visible keyboard focus everywhere */
  a:focus-visible,
  button:focus-visible,
  select:focus-visible,
  input:focus-visible,
  [tabindex]:focus-visible {
    outline: 2px solid #a29bfe;
    outline-offset: 2px;
  }

  /* TOP HEADER WITH FLAGS BANNER */
  .top-navbar {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 24px;
    text-align: center;
  }

  .flag-banner {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 8px 16px;
    background: rgba(30, 24, 42, 0.6);
    border: 1px solid var(--border);
    border-radius: 30px;
    margin-bottom: 14px;
    backdrop-filter: blur(8px);
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    flex-wrap: wrap;
    max-width: 100%;
  }

  .flag-banner span {
    font-size: 18px;
    line-height: 1;
  }

  .brand-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(108, 92, 231, 0.15);
    border: 1px solid rgba(108, 92, 231, 0.35);
    color: #c7c1fb;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    padding: 4px 12px;
    border-radius: 20px;
    margin-bottom: 8px;
  }

  .brand-badge::before {
    content: '';
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #a29bfe;
    box-shadow: 0 0 8px #a29bfe;
  }

  .brand-title {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 28px;
    letter-spacing: -0.6px;
    margin: 0;
    background: linear-gradient(135deg, #ffffff 30%, #c7cbd4 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .brand-sub {
    font-size: 13px;
    color: var(--text-dim);
    margin: 6px 0 0;
  }

  /* SEGMENTED MODE SWITCHER */
  .mode-switch-wrapper {
    background: rgba(30, 24, 42, 0.7);
    backdrop-filter: blur(12px);
    border: 1px solid var(--border);
    padding: 5px;
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    margin-bottom: 20px;
  }

  .mode-switch {
    display: flex;
    gap: 6px;
  }

  .mode-btn {
    flex: 1;
    padding: 12px 16px;
    text-align: center;
    font-weight: 700;
    font-size: 13.5px;
    border-radius: 12px;
    cursor: pointer;
    color: var(--text-dim);
    transition: background 0.25s ease, color 0.25s ease, box-shadow 0.25s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    border: 1px solid transparent;
    background: none;
    font-family: inherit;
  }

  .mode-btn.active {
    background: var(--accent-gradient);
    color: #fff;
    border-color: rgba(255, 255, 255, 0.2);
    box-shadow: 0 6px 20px var(--accent-glow);
  }

  /* Controls Card */
  .controls-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 20px;
    margin-bottom: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    box-shadow: 0 12px 32px rgba(0,0,0,0.25);
  }

  .grid-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    align-items: end;
  }

  .swap-row {
    display: flex;
    justify-content: center;
    margin-top: -4px;
  }

  .swap-btn {
    background: var(--card-light);
    border: 1px solid var(--border);
    color: var(--text-dim);
    width: 34px;
    height: 34px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .swap-btn:hover { color: #fff; border-color: #a29bfe; }

  .control-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .control-group label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-dim);
    font-weight: 700;
  }

  select, input[type="text"], input[type="range"] {
    width: 100%;
    padding: 11px 12px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--card-light);
    color: var(--text);
    font-family: inherit;
    font-size: 13.5px;
    font-weight: 600;
    outline: none;
  }

  .slider-container {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .rate-val {
    font-size: 12px;
    font-weight: 700;
    color: #c7c1fb;
    min-width: 35px;
  }

  /* Panel Structure */
  .panel {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 22px;
    overflow: hidden;
    box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    margin-bottom: 22px;
  }

  .panel-head {
    padding: 15px 20px;
    background: var(--card-light);
    border-bottom: 1px solid var(--border);
    font-size: 13.5px;
    font-weight: 600;
    color: var(--text-dim);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .messages {
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    min-height: 200px;
    max-height: 380px;
    overflow-y: auto;
  }

  .messages:empty::before {
    content: 'Say or type something above and your conversation will show up here.';
    color: var(--text-dim);
    font-size: 13.5px;
    display: block;
    text-align: center;
    padding: 30px 10px;
  }

  .msg {
    font-size: 14px;
    line-height: 1.5;
    max-width: 85%;
    padding: 12px 16px;
    border-radius: 14px;
    white-space: pre-wrap;
  }

  .msg.bot {
    background: var(--card-light);
    color: var(--text);
    border-bottom-left-radius: 4px;
    align-self: flex-start;
    border: 1px solid var(--border);
  }

  .msg.user {
    background: var(--accent);
    color: #fff;
    border-bottom-right-radius: 4px;
    align-self: flex-end;
  }

  .msg.error {
    background: rgba(255, 118, 117, 0.12);
    border: 1px solid rgba(255, 118, 117, 0.4);
    color: #ffb4b3;
    align-self: flex-start;
    border-bottom-left-radius: 4px;
  }

  /* Typing / loading indicator */
  .typing-dots {
    display: inline-flex;
    gap: 4px;
    align-self: flex-start;
    background: var(--card-light);
    border: 1px solid var(--border);
    padding: 12px 16px;
    border-radius: 14px;
    border-bottom-left-radius: 4px;
  }
  .typing-dots span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--text-dim);
    animation: bounce 1.2s infinite ease-in-out;
  }
  .typing-dots span:nth-child(2) { animation-delay: 0.15s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
    30% { transform: translateY(-4px); opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce) {
    .typing-dots span { animation: none; opacity: 0.8; }
  }

  .input-row {
    display: flex;
    gap: 8px;
    padding: 14px;
    background: var(--card-light);
    border-top: 1px solid var(--border);
  }

  .input-row input {
    flex: 1;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    font-size: 14px;
    background: var(--bg);
    color: var(--text);
    outline: none;
  }

  .action-btn {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 12px;
    width: 46px;
    height: 46px;
    cursor: pointer;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .action-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  .action-btn.recording {
    background: var(--coral);
  }

  .voice-only-box {
    display: none;
    padding: 40px 20px;
    text-align: center;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }

  .big-mic-btn {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: var(--accent-gradient);
    color: #fff;
    border: none;
    font-size: 32px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 8px 24px var(--accent-glow);
  }

  .big-mic-btn.recording {
    background: var(--coral);
  }

  .clear-link {
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    margin-left: auto;
    padding: 4px 6px;
  }
  .clear-link:hover { color: #fff; }

  /* All-languages panel at the bottom */
  .all-langs-input {
    padding: 16px;
    display: flex;
    gap: 8px;
    border-bottom: 1px solid var(--border);
  }

  .all-langs-input input {
    flex: 1;
  }

  .all-langs-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 1px;
    background: var(--border);
  }

  .lang-result {
    background: var(--card);
    padding: 14px 20px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .lang-result .lang-name {
    font-size: 11px;
    font-weight: 700;
    color: #c7c1fb;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .lang-result .lang-name span {
    font-size: 13px;
  }

  .lang-result .lang-text {
    font-size: 14.5px;
    line-height: 1.5;
    color: var(--text);
    min-height: 1.4em;
  }

  .lang-result .lang-text.placeholder {
    color: var(--text-dim);
  }

  .lang-result .lang-text.pending {
    color: var(--text-dim);
  }

  .lang-result .lang-text.failed {
    color: #ffb4b3;
  }

  .all-langs-empty {
    padding: 30px 20px;
    text-align: center;
    color: var(--text-dim);
    font-size: 13.5px;
  }

  .visually-hidden {
    position: absolute;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden;
    clip: rect(0,0,0,0);
    white-space: nowrap;
    border: 0;
  }

  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--card-light); border-radius: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <!-- TOP HEADER WITH FLAGS BANNER -->
  <div class="top-navbar">
    <div class="flag-banner" role="img" aria-label="Supported languages: Farsi, English, Spanish, French, German, Portuguese, Italian, Arabic, Japanese, Turkish">
      <span aria-hidden="true">🇮🇷</span>
      <span aria-hidden="true">🇬🇧</span>
      <span aria-hidden="true">🇪🇸</span>
      <span aria-hidden="true">🇫🇷</span>
      <span aria-hidden="true">🇩🇪</span>
      <span aria-hidden="true">🇵🇹</span>
      <span aria-hidden="true">🇮🇹</span>
      <span aria-hidden="true">🇸🇦</span>
      <span aria-hidden="true">🇯🇵</span>
      <span aria-hidden="true">🇹🇷</span>
    </div>
    <div class="brand-badge">AI Multi-Language Studio</div>
    <h1 class="brand-title">🌐 Tongue Tied</h1>
    <p class="brand-sub">Speak or type in one language, get it back in another — instantly.</p>
  </div>

  <!-- SEGMENTED SWITCHER -->
  <div class="mode-switch-wrapper">
    <div class="mode-switch" role="tablist" aria-label="Translation mode">
      <button class="mode-btn active" id="modeText" role="tab" aria-selected="true" onclick="setMode('text')">
        <span aria-hidden="true">✍️</span> Text
      </button>
      <button class="mode-btn" id="modeVoice" role="tab" aria-selected="false" onclick="setMode('voice')">
        <span aria-hidden="true">🎙️</span> Voice
      </button>
    </div>
  </div>

  <!-- Controls Card -->
  <div class="controls-card">
    <div class="grid-2">
      <div class="control-group">
        <label for="sourceLang">I'm speaking</label>
        <select id="sourceLang"></select>
      </div>
      <div class="control-group">
        <label for="targetLang">Translate into</label>
        <select id="targetLang"></select>
      </div>
    </div>
    <div class="swap-row">
      <button class="swap-btn" id="swapBtn" type="button" aria-label="Swap the two languages" title="Swap languages">⇅</button>
    </div>

    <div class="control-group">
      <label for="speechRate">Playback speed: <span class="rate-val" id="rateVal">1.0×</span></label>
      <div class="slider-container">
        <input type="range" id="speechRate" min="0.5" max="1.5" step="0.1" value="1.0" aria-valuetext="1.0 times">
      </div>
    </div>
  </div>

  <!-- Main Panel -->
  <div class="panel">
    <div class="panel-head">
      <span id="statusHeader">✍️ Text mode — type a message below</span>
      <button class="clear-link" id="clearBtn" type="button">Clear chat</button>
    </div>

    <div class="messages" id="messages" aria-live="polite"></div>

    <!-- Voice Mode Big Mic View -->
    <div class="voice-only-box" id="voiceOnlyBox">
      <button class="big-mic-btn" id="bigMicBtn" aria-label="Start speaking" aria-pressed="false">🎙️</button>
      <div style="font-size: 13px; color: var(--text-dim);" id="voiceStatusText">Tap the microphone and start talking</div>
    </div>

    <!-- Text Mode Input Row -->
    <div class="input-row" id="textInputRow">
      <label for="userInput" class="visually-hidden">Message to translate</label>
      <input id="userInput" type="text" placeholder="Type something to translate…" autocomplete="off" />
      <button class="action-btn" id="micBtn" type="button" aria-label="Speak instead of typing" aria-pressed="false">🎙️</button>
      <button class="action-btn" id="sendBtn" type="button" aria-label="Translate and send">➤</button>
    </div>
  </div>

  <!-- All-languages panel -->
  <div class="panel" id="allLangsPanel">
    <div class="panel-head">
      <span>🌍 See it in all 10 languages at once</span>
    </div>
    <div class="all-langs-input">
      <label for="allLangsInput" class="visually-hidden">Text to translate into every language</label>
      <input id="allLangsInput" type="text" placeholder="Type a word or phrase…" autocomplete="off" />
      <button class="action-btn" id="allLangsBtn" type="button" aria-label="Translate into every language">➤</button>
    </div>
    <div class="all-langs-grid" id="allLangsGrid"></div>
  </div>
</div>

<script>
const LANGUAGES = [
  {code:'fa', name:'Farsi / Persian', speechLocale:'fa-IR', flag:'🇮🇷'},
  {code:'en', name:'English',         speechLocale:'en-US', flag:'🇬🇧'},
  {code:'es', name:'Spanish',         speechLocale:'es-ES', flag:'🇪🇸'},
  {code:'fr', name:'French',          speechLocale:'fr-FR', flag:'🇫🇷'},
  {code:'de', name:'German',          speechLocale:'de-DE', flag:'🇩🇪'},
  {code:'pt', name:'Portuguese',      speechLocale:'pt-PT', flag:'🇵🇹'},
  {code:'it', name:'Italian',         speechLocale:'it-IT', flag:'🇮🇹'},
  {code:'ar', name:'Arabic',          speechLocale:'ar-SA', flag:'🇸🇦'},
  {code:'ja', name:'Japanese',        speechLocale:'ja-JP', flag:'🇯🇵'},
  {code:'tr', name:'Turkish',         speechLocale:'tr-TR', flag:'🇹🇷'}
];

const STORAGE_KEY = 'tongueTiedHistory';
// Raises the free MyMemory quota from 5,000 to 50,000 characters/day — no signup, no cost.
// Swap this for a real inbox you control whenever you're ready; it doesn't need to be verified.
const MYMEMORY_EMAIL = 'tonguetiedapp@gmail.com';

let isRecording = false;
let recognition = null;
let speechSupported = false;

const sourceSelect = document.getElementById('sourceLang');
const targetSelect = document.getElementById('targetLang');
const swapBtn = document.getElementById('swapBtn');
const rateSlider = document.getElementById('speechRate');
const rateValDisplay = document.getElementById('rateVal');

const messagesEl = document.getElementById('messages');
const input = document.getElementById('userInput');
const sendBtn = document.getElementById('sendBtn');
const micBtn = document.getElementById('micBtn');
const bigMicBtn = document.getElementById('bigMicBtn');
const voiceOnlyBox = document.getElementById('voiceOnlyBox');
const textInputRow = document.getElementById('textInputRow');
const statusHeader = document.getElementById('statusHeader');
const voiceStatusText = document.getElementById('voiceStatusText');
const clearBtn = document.getElementById('clearBtn');

const allLangsInput = document.getElementById('allLangsInput');
const allLangsBtn = document.getElementById('allLangsBtn');
const allLangsGrid = document.getElementById('allLangsGrid');

function populateDropdowns() {
  LANGUAGES.forEach((l, index) => {
    const optSource = document.createElement('option');
    optSource.value = index;
    optSource.textContent = l.name;
    sourceSelect.appendChild(optSource);

    const optTarget = document.createElement('option');
    optTarget.value = index;
    optTarget.textContent = l.name;
    targetSelect.appendChild(optTarget);
  });

  sourceSelect.value = 0; // Farsi
  targetSelect.value = 1; // English
}

populateDropdowns();

// ---------- Conversation persistence (per-device, this browser only) ----------
function loadHistory() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const items = JSON.parse(raw);
    items.forEach(item => addMessage(item.text, item.sender, { save: false }));
  } catch (e) {
    // If storage is unavailable or corrupted, just start fresh.
  }
}

function saveHistory() {
  try {
    const items = Array.from(messagesEl.querySelectorAll('.msg')).map(el => ({
      text: el.textContent,
      sender: el.classList.contains('user') ? 'user' : (el.classList.contains('error') ? 'error' : 'bot')
    }));
    localStorage.setItem(STORAGE_KEY, JSON.stringify(items.slice(-40)));
  } catch (e) {
    // Storage full or blocked — conversation just won't persist this session.
  }
}

clearBtn.addEventListener('click', () => {
  messagesEl.innerHTML = '';
  try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
});

// ---------- Rate slider ----------
rateSlider.addEventListener('input', (e) => {
  rateValDisplay.textContent = `${parseFloat(e.target.value).toFixed(1)}×`;
});

// ---------- Swap languages ----------
swapBtn.addEventListener('click', () => {
  const a = sourceSelect.value;
  sourceSelect.value = targetSelect.value;
  targetSelect.value = a;
});

// ---------- Mode switching ----------
function setMode(mode) {
  const textBtn = document.getElementById('modeText');
  const voiceBtn = document.getElementById('modeVoice');
  textBtn.classList.toggle('active', mode === 'text');
  voiceBtn.classList.toggle('active', mode === 'voice');
  textBtn.setAttribute('aria-selected', mode === 'text');
  voiceBtn.setAttribute('aria-selected', mode === 'voice');

  if (mode === 'voice') {
    voiceOnlyBox.style.display = 'flex';
    textInputRow.style.display = 'none';
    statusHeader.textContent = '🎙️ Voice mode — tap the mic and talk';
  } else {
    voiceOnlyBox.style.display = 'none';
    textInputRow.style.display = 'flex';
    statusHeader.textContent = '✍️ Text mode — type a message below';
  }
}

// ---------- Speech recognition (input) ----------
function initSpeech() {
  try {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = false;
      speechSupported = true;

      recognition.onresult = (event) => {
        if (event.results && event.results[0]) {
          const transcript = event.results[0][0].transcript;
          stopRecording();
          sendMessage(transcript);
        }
      };
      recognition.onerror = (event) => {
        stopRecording();
        if (event && (event.error === 'not-allowed' || event.error === 'service-not-allowed')) {
          voiceStatusText.textContent = "Microphone access is blocked — allow it in your browser settings and try again.";
        } else if (event && event.error === 'no-speech') {
          voiceStatusText.textContent = "Didn't catch that — tap the mic and try again.";
        } else {
          voiceStatusText.textContent = "Tap the microphone and start talking";
        }
      };
      recognition.onend = () => stopRecording();
    }
  } catch (e) {
    speechSupported = false;
  }
}

initSpeech();

function startRecording() {
  if (!recognition) {
    addMessage("This browser can't listen for speech — that's common inside the WhatsApp or Instagram in-app browser. Open this page in Safari or Chrome instead, or just type your message.", 'error');
    return;
  }
  try {
    isRecording = true;
    micBtn.classList.add('recording');
    micBtn.setAttribute('aria-pressed', 'true');
    bigMicBtn.classList.add('recording');
    bigMicBtn.setAttribute('aria-pressed', 'true');
    voiceStatusText.textContent = "Listening…";

    const srcObj = LANGUAGES[sourceSelect.value];
    recognition.lang = srcObj.speechLocale;
    recognition.start();
  } catch (e) {
    stopRecording();
  }
}

function stopRecording() {
  isRecording = false;
  micBtn.classList.remove('recording');
  micBtn.setAttribute('aria-pressed', 'false');
  bigMicBtn.classList.remove('recording');
  bigMicBtn.setAttribute('aria-pressed', 'false');
  if (voiceStatusText.textContent === 'Listening…') {
    voiceStatusText.textContent = "Tap the microphone and start talking";
  }
  if (recognition) {
    try { recognition.stop(); } catch (e) {}
  }
}

micBtn.addEventListener('click', () => isRecording ? stopRecording() : startRecording());
bigMicBtn.addEventListener('click', () => isRecording ? stopRecording() : startRecording());

// ---------- Speech synthesis (output) ----------
function speak(text, locale) {
  try {
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = locale;
      utterance.rate = parseFloat(rateSlider.value);
      window.speechSynthesis.speak(utterance);
    }
  } catch (e) {
    // Playback just won't happen; the text is still shown on screen.
  }
}

// ---------- Chat messages ----------
function addMessage(text, sender, opts) {
  const div = document.createElement('div');
  div.className = 'msg ' + sender;
  div.textContent = text;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  if (!opts || opts.save !== false) saveHistory();
  return div;
}

function showTyping() {
  const el = document.createElement('div');
  el.className = 'typing-dots';
  el.id = 'typingIndicator';
  el.innerHTML = '<span></span><span></span><span></span>';
  el.setAttribute('aria-label', 'Translating…');
  messagesEl.appendChild(el);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function hideTyping() {
  const el = document.getElementById('typingIndicator');
  if (el) el.remove();
}

async function translateText(text, fromCode, toCode) {
  const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${fromCode}|${toCode}&de=${encodeURIComponent(MYMEMORY_EMAIL)}`;
  const response = await fetch(url);
  if (!response.ok) throw new Error('Request failed');
  const data = await response.json();
  if (data && data.responseData && data.responseData.translatedText) {
    return data.responseData.translatedText;
  }
  throw new Error('No translation returned');
}

async function sendMessage(text) {
  if (!text || !text.trim()) return;

  addMessage(text, 'user');
  input.value = '';
  sendBtn.disabled = true;
  showTyping();

  const srcObj = LANGUAGES[sourceSelect.value];
  const tgtObj = LANGUAGES[targetSelect.value];

  try {
    const reply = await translateText(text, srcObj.code, tgtObj.code);
    hideTyping();
    addMessage(reply, 'bot');
    speak(reply, tgtObj.speechLocale);
  } catch (err) {
    hideTyping();
    addMessage("Couldn't reach the translation service. Check your connection and try again.", 'error');
  } finally {
    sendBtn.disabled = false;
  }
}

sendBtn.addEventListener('click', () => sendMessage(input.value));
input.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendMessage(input.value); });

// ---------- All-languages panel ----------
function buildAllLangsGrid() {
  allLangsGrid.innerHTML = '';
  LANGUAGES.forEach((l) => {
    const row = document.createElement('div');
    row.className = 'lang-result';
    row.id = `langrow-${l.code}`;
    row.innerHTML = `
      <div class="lang-name"><span aria-hidden="true">${l.flag}</span> ${l.name}</div>
      <div class="lang-text placeholder">Translation will show up here.</div>
    `;
    allLangsGrid.appendChild(row);
  });
}
buildAllLangsGrid();

let allLangsRequestId = 0;

async function translateToAllLanguages(text) {
  if (!text || !text.trim()) return;
  const requestId = ++allLangsRequestId;

  LANGUAGES.forEach((l) => {
    const textEl = document.querySelector(`#langrow-${l.code} .lang-text`);
    textEl.textContent = 'Translating…';
    textEl.className = 'lang-text pending';
  });

  // A source language for this panel: assume the text is in the "I'm speaking" language above.
  const srcObj = LANGUAGES[sourceSelect.value];

  await Promise.all(LANGUAGES.map(async (l) => {
    const textEl = document.querySelector(`#langrow-${l.code} .lang-text`);
    if (l.code === srcObj.code) {
      if (requestId !== allLangsRequestId) return;
      textEl.textContent = text;
      textEl.className = 'lang-text';
      return;
    }
    try {
      const result = await translateText(text, srcObj.code, l.code);
      if (requestId !== allLangsRequestId) return;
      textEl.textContent = result;
      textEl.className = 'lang-text';
    } catch (e) {
      if (requestId !== allLangsRequestId) return;
      textEl.textContent = "Couldn't translate this one — try again.";
      textEl.className = 'lang-text failed';
    }
  }));
}

allLangsBtn.addEventListener('click', () => translateToAllLanguages(allLangsInput.value));
allLangsInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') translateToAllLanguages(allLangsInput.value); });

// ---------- Init ----------
loadHistory();
</script>
</body>
</html>
